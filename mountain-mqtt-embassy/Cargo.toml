[package]
name = "mountain-mqtt-embassy"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local patched copy: defmt made fully conditional so panics report real source lines"

[dependencies]
embassy-net = { version = "0.7.0", default-features = false, features = [
  "tcp",
  "udp",
  "raw",
  "dhcpv4",
  "medium-ethernet",
  "dns",
] }

embassy-sync = { version = "0.7.2", default-features = false }

embassy-time = { version = "0.5.0", default-features = false }

defmt = { version = "1.0", optional = true }

mountain-mqtt = { git = "https://github.com/ckellar33/mqtt_embassy", default-features = false, features = [
  "embedded-io-async",
  "embedded-hal-async",
] }

[features]
default = []
defmt = ["dep:defmt", "embassy-net/defmt", "embassy-sync/defmt", "embassy-time/defmt", "mountain-mqtt/defmt"]
